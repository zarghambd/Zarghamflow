openapi: 3.1.0
info:
  title: ZarghamFlow API
  version: 1.0.0
  description: Multi-user meeting and task planner API. Mutations require the zf_csrf cookie and X-CSRF-Token header.
servers:
  - url: /api/v1
paths:
  /auth/csrf:
    get:
      summary: Create a CSRF token
      responses: {'200': {description: CSRF token}}
  /auth/request:
    post:
      summary: Legacy OTP signup request
      description: Requires the zf_csrf cookie and X-CSRF-Token header. New clients should use /auth/signup or /auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpRequest'}
      responses:
        '200':
          description: OTP request accepted for the legacy registration alias
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OtpRequestResponse'}
        '429':
          description: Send limit or resend cooldown reached
          headers:
            Retry-After: {description: Seconds until another request is accepted, schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /auth/signup:
    post:
      summary: Register a new account and request a verification code
      description: Requires the zf_csrf cookie and X-CSRF-Token header. Existing email addresses return 409 ACCOUNT_EXISTS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpSignup'}
      responses:
        '200':
          description: Verification code sent; the client should immediately display code entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OtpRequestResponse'}
        '400': {description: Invalid signup details}
        '409': {description: Email address already belongs to an account}
        '429':
          description: Send limit or resend cooldown reached
          headers:
            Retry-After: {description: Seconds until another request is accepted, schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /auth/login:
    post:
      summary: Request a sign-in code for an existing account
      description: Requires the zf_csrf cookie and X-CSRF-Token header.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpRequest'}
      responses:
        '200': {description: Sign-in code sent}
        '400': {description: Invalid email address}
        '404': {description: No account exists for this email}
        '403': {description: Account is disabled}
        '429':
          description: Send limit or resend cooldown reached
          headers:
            Retry-After: {description: Seconds until another request is accepted, schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /auth/verify:
    post:
      summary: Verify a 6-digit code and create or rotate a session
      description: Requires the zf_csrf cookie and X-CSRF-Token header. Codes expire after 10 minutes and are single-use.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OtpVerify'}
      responses:
        '200':
          description: Signed in; includes the current user and redirects to the planner
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OtpVerifyResponse'}
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '403': {description: Account is disabled}
        '404': {description: Login code does not match an existing account}
        '409': {description: Signup code was verified after an account was registered for this email}
        '429':
          description: Verification rate limit or code attempt lock reached
          headers:
            Retry-After: {description: Seconds until another request is accepted, schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /auth/me:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current user}, '401': {description: No valid session}, '403': {description: Account is disabled}}
  /meetings:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: client, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses: {'200': {description: Paged meetings}}
    post:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'201': {description: Created meeting}, '400': {description: Validation error}, '409': {description: Meeting title already exists}}
  /meetings/{id}:
    patch:
      security: [{cookieAuth: []}, {csrf: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Updated meeting}, '409': {description: Version conflict or duplicate title}}
    delete:
      security: [{cookieAuth: []}, {csrf: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'204': {description: Soft deleted}}
  /meetings/{id}/duplicate:
    post:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'201': {description: Duplicated meeting}, '409': {description: Meeting title already exists}}
  /tasks:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Paged tasks}}
    post:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'201': {description: Created task}, '409': {description: Task title already exists}}
  /tasks/{id}:
    patch:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'200': {description: Updated task}, '409': {description: Version conflict or duplicate title}}
    delete:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'204': {description: Soft deleted}}
  /tasks/quick-add:
    post:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'201': {description: Parsed task}, '409': {description: Task title already exists}}
  /dashboard:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Counters, today view, overdue and weekly items}}
  /reminder-preferences:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Reminder preferences}}
    put:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'200': {description: Saved preferences}}
  /reminders:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Reminder delivery log}}
  /push/subscribe:
    post:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'201': {description: Push subscription stored}}
    delete:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'204': {description: Subscription removed}}
  /import:
    post:
      security: [{cookieAuth: []}, {csrf: []}]
      responses: {'200': {description: Legacy backup imported}}
  /export.json:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: JSON backup}}
  /export.csv:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: CSV export}}
  /export.ics:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: iCalendar export}}
components:
  schemas:
    OtpSignup:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: {type: string, minLength: 1, maxLength: 100}
        lastName: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email, maxLength: 254}
    OtpRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    OtpVerify:
      type: object
      required: [email, code]
      properties:
        email: {type: string, format: email, maxLength: 254}
        code: {type: string, pattern: '^\d{6}$'}
    OtpRequestResponse:
      type: object
      required: [ok, message]
      properties:
        ok: {type: boolean, const: true}
        message: {type: string}
    OtpVerifyResponse:
      type: object
      required: [ok, user, redirect]
      properties:
        ok: {type: boolean, const: true}
        user:
          type: object
          required: [email, role]
          properties:
            email: {type: string, format: email}
            role: {type: string, enum: [admin, user]}
            firstName: {type: string}
            lastName: {type: string}
        redirect: {type: string, enum: [/admin, /planner]}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: zf_session}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
